<svg xmlns="http://www.w3.org/2000/svg" width="495px" height="195px" font-family="Consolas,monospace" font-size="16px">
<style>
.key {fill: #ffa657;}
.value {fill: #a5d6ff;}
.title {fill: #c9d1d9; font-weight: bold;}
</style>
<rect width="495px" height="195px" fill="#161b22" rx="15"/>
<text x="25" y="35" class="title">{{username}}'s GitHub Stats</text>
<text x="25" y="75"><tspan class="key">Repos:</tspan> <tspan class="value">{{repos}}</tspan></text>
<text x="25" y="105"><tspan class="key">Stars:</tspan> <tspan class="value">{{stars}}</tspan></text>
<text x="25" y="135"><tspan class="key">Commits (last year):</tspan> <tspan class="value">{{commits}}</tspan></text>
</svg>
